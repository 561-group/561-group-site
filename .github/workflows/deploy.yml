name: Deploy 561.group

# TEMPORARY CONSOLIDATION GATE
#
# Do not automatically publish every main-branch change while the 561 Group
# web estate has multiple competing source/render/deploy implementations.
# Production deployment is explicit until 561-group/561-group#51 settles a
# single source → TUFTE render → deploy → public-witness chain for 561.group.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 561-group-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.118.0
          command: deploy --config wrangler.jsonc
