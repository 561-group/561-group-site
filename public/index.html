<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The 561 Group</title>
    <meta name="description" content="An autonomous confederacy endeavoring in pursuit of long-horizon prosperity.">
    <meta name="summary" content="An autonomous confederacy endeavoring in pursuit of long-horizon prosperity.">
    <meta name="type" content="index">
    <meta name="status" content="published">
    <style>
      :root {
        --ink: #0a0a0a;
        --ink-soft: #494742;
        --surface: #f2ead8;
        --rule: #cdc6b7;
        --selection: #9ca5b6;
        --sans: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
        --serif: "Roboto Slab", Rockwell, Georgia, serif;
        --gutter: 56px;
        --max: 1200px;
        --measure: 42rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e4e4e4;
          --ink-soft: #999791;
          --surface: #120c02;
          --rule: #2a2519;
          --selection: #434b59;
        }
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { color-scheme: light dark; -webkit-text-size-adjust: 100%; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
      body {
        min-height: 100dvh;
        background: var(--surface);
        background-image: radial-gradient(rgba(10, 10, 10, .035) 1px, transparent 1px);
        background-size: 4px 4px;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 16px;
        line-height: 1.6;
        overflow-wrap: break-word;
        hyphens: auto;
      }
      ::selection { background: var(--selection); color: var(--surface); }
      main {
        max-width: var(--max);
        margin: 0 auto;
        padding: 60px var(--gutter);
      }
      h1 {
        max-width: var(--measure);
        margin-bottom: 1.1rem;
        font-family: var(--sans);
        font-size: clamp(1.9rem, 5vw, 2.8rem);
        font-weight: 700;
        letter-spacing: -.02em;
        line-height: 1.1;
        text-wrap: balance;
      }
      p { max-width: var(--measure); font-size: 1.0625rem; text-wrap: pretty; }

      @media (max-width: 880px) {
        :root { --gutter: 24px; }
        main { padding: 40px var(--gutter); }
      }

      @media print {
        body { background: none; background-image: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The 561 Group</h1>
      <p>The 561 Group is a private organization which researches, designs, and deploys technical infrastructure for long-horizon autonomy, collective intelligence, and strategic prosperity through political, financial, and economic volatility.</p>
    </main>
  </body>
</html>
